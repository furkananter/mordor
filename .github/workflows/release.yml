name: Release

# Fires on annotated/lightweight tag pushes whose name starts with `v`
# (matches `v0.2.6`, `v1.0.0-rc.1`, etc). Bumping with `npm version <bump>`
# already creates this tag — pushing the tag is the publish trigger.
#
# Also exposes `workflow_dispatch` so a maintainer can re-run a botched
# release without retagging. The job reads the version straight from
# package.json, so a re-run picks up whatever's checked into the ref.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # required for electron-builder to create/edit the GitHub Release

jobs:
  build:
    name: Build & publish (${{ matrix.os }})
    strategy:
      # Don't bail out the other platforms when one fails. A release is more
      # useful with two artifacts than zero, and the failing platform's logs
      # are easier to read after the others have finished.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (arm64 + x64)
            build_args: --mac --arm64 --x64
          - os: ubuntu-latest
            label: Linux (x64 AppImage)
            build_args: --linux --x64
          - os: windows-latest
            label: Windows (x64 NSIS)
            build_args: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    # Signing secrets exposed under SIGN_* names that electron-builder does NOT
    # read. The "Configure macOS signing" step below promotes them to the real
    # CSC_LINK / APPLE_* names ONLY when a certificate is actually present.
    # This indirection is deliberate: an empty-but-defined CSC_LINK makes
    # electron-builder enter the certificate-signing path and fail ("not a
    # file"), so for unsigned (ad-hoc) builds CSC_LINK must be left UNSET, not
    # set to "". On non-mac runners the promotion step is skipped, so the mac
    # .p12 never reaches the Windows/Linux signers.
    env:
      SIGN_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      SIGN_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      SIGN_APPLE_ID: ${{ secrets.APPLE_ID }}
      SIGN_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      SIGN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Linux needs libsecret headers so keytar's native rebuild succeeds.
      # macOS and Windows already ship the Keychain / Credential Vault APIs.
      - name: Install libsecret (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      # Promote the signing secrets to the env names electron-builder reads, but
      # ONLY on macOS AND only when a Developer ID certificate is configured.
      # Leaving CSC_LINK unset for unsigned builds is required (see env note
      # above). Running before "Build app bundle" also lets esbuild bake the
      # matching __MAC_SIGNED__ flag, since build-main.mjs keys it on CSC_LINK.
      - name: Configure macOS signing
        if: matrix.os == 'macos-latest' && env.SIGN_CSC_LINK != ''
        run: |
          {
            echo "CSC_LINK=$SIGN_CSC_LINK"
            echo "CSC_KEY_PASSWORD=$SIGN_CSC_KEY_PASSWORD"
            echo "APPLE_ID=$SIGN_APPLE_ID"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$SIGN_APPLE_APP_SPECIFIC_PASSWORD"
            echo "APPLE_TEAM_ID=$SIGN_APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Developer ID certificate detected — signing + notarization enabled."

      # Run our own pre-publish guards so a broken build never gets to the
      # publish step. Cheap: 1-2 minutes on Node 22.
      - name: Type-check
        run: npm run compile

      - name: Run tests
        run: npm test

      # Produce `dist/main/index.cjs` (esbuild), `dist/preload/index.cjs`, and
      # the Vite renderer bundle. electron-builder expects all of these in
      # `dist/**` per the `build.files` glob in package.json — without this
      # step it packages an empty app.asar and fails the sanity check with
      # "dist/main/index.cjs ... was not found in this archive".
      # `npm run build` also re-runs `tsc --noEmit`; that's redundant with the
      # Type-check step above but cheap (~5 s) and keeps the script the same
      # one developers run locally.
      - name: Build app bundle
        run: npm run build

      # The actual release. `electron-builder --publish always` uploads the
      # artifacts to a GitHub Release matching the current version (it creates
      # the release on the first matrix job, the others append to it). The
      # `releaseType: release` in package.json's publish config means it's
      # published immediately rather than left as a draft, so electron-updater
      # clients actually see it. No PAT needed — GITHUB_TOKEN is repo-scoped and
      # has `contents: write` via the job-level `permissions` block above.
      - name: Package & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.build_args }} --publish always
